name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android App Package via Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          npx @bubblewrap/cli init --manifest="https://rumbo.vercel.app/manifest.json" --directory="./twa-project" --skipPrompt || true
          if [ -d "./twa-project" ]; then
            cd twa-project
            npx @bubblewrap/cli build --skipSigning || true
          fi

      - name: Package Release Files & Web Dist
        uses: actions/upload-artifact@v4
        with:
          name: RUMBO-APK-Installer
          path: |
            dist/
            twa-project/*.apk
            twa-project/*.aab
