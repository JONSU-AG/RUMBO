name: Build Android APK (PWABuilder / Bubblewrap)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p android-build
          cd android-build
          npx @bubblewrap/cli init --manifest="https://rumbo.vercel.app/manifest.json" --directory="." || true

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumbo-web-dist
          path: dist/
