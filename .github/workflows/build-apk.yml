name: Build Android APK (PWABuilder / Bubblewrap)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap & Build Android Project
        run: |
          npm install -g @bubblewrap/cli
          npx @bubblewrap/cli init --manifest="https://rumbo.vercel.app/manifest.json" --directory="./android-project" --skipPrompt || true
          if [ -d "./android-project" ]; then
            cd android-project
            npx @bubblewrap/cli build || true
          fi

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rumbo-web-dist
          path: dist/
