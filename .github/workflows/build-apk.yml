name: Build Android APK (PWABuilder / Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Dist
        run: npm run build

      - name: Capacitor Init & Add Android
        run: |
          npx cap init RUMBO com.rumbo.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload RUMBO APK
        uses: actions/upload-artifact@v4
        with:
          name: RUMBO-APK-Installer
          path: android/app/build/outputs/apk/debug/app-debug.apk
