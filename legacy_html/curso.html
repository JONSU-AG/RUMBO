<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso · RUMBO</title>

  <!-- Fuentes Google: Poppins e Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos Modulares RUMBO Web App PWA (3 Archivos) -->
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/mobile-app.css">
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

  <!-- =====================================================
       HEADER / CABECERA
  ===================================================== -->
  <header class="site-header">
    <div class="container">
      
      <!-- LOGO -->
      <a href="index.html" class="brand" aria-label="RUMBO Inicio">
        <span class="logo-box">
          <img class="logo-mark" src="assets/LOGOR.png" alt="RUMBO" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex'">
          <svg class="logo-fallback" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="24" r="14" fill="#4CC3F0"/>
            <circle cx="16" cy="19" r="2.2" fill="#0B1229"/>
            <path d="M8 24 L2 20 L8 28 Z" fill="#4CC3F0"/>
            <text x="21" y="34" font-family="Poppins, sans-serif" font-weight="800" font-size="30" fill="#E8433F">R</text>
          </svg>
        </span>
        RUMBO
      </a>

      <!-- NAVEGACIÓN ESCRITORIO -->
      <nav class="main-nav" id="main-nav">
        <a href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l9-8 9 8"/>
            <path d="M5 10v10h14V10"/>
          </svg>
          Inicio
        </a>

        <a href="cursos.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          Cursos
        </a>

        <a href="practicas.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1"/>
            <path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/>
            <path d="M9 12h6M9 16h6"/>
          </svg>
          Prácticas
        </a>

        <a href="simulador.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M8 16v-3"/>
            <path d="M12 16V8"/>
            <path d="M16 16v-5"/>
          </svg>
          Simulador
        </a>

        <a href="tomos.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          Tomos
        </a>
      </nav>

      <!-- BOTÓN MENÚ MÓVIL -->
      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú de navegación" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

    </div>
  </header>

  <main class="container">

    <!-- MIGAS DE PAN -->
    <div style="padding-top: 24px;">
      <a href="cursos.html" style="display:inline-flex; align-items:center; gap:6px; color:var(--blue); font-size:0.88rem; font-weight:600;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Volver a Cursos</span>
      </a>
    </div>

    <!-- CABECERA DEL CURSO -->
    <section class="section" style="padding-top: 16px; padding-bottom: 20px;">
      <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
        <div style="width:58px; height:58px; border-radius:var(--radius-md); background:var(--blue-light); display:flex; align-items:center; justify-content:center; font-size:2rem;" id="course-emoji">
          📘
        </div>
        <div>
          <h1 id="course-title" style="font-size:clamp(1.5rem, 3vw, 2rem); color:var(--navy); margin-bottom:4px;">Cargando...</h1>
          <p id="course-sub" style="color:var(--text-muted); font-size:0.92rem;"></p>
        </div>
      </div>

      <!-- AVISO DE CLASES -->
      <div class="daily-quote-card" style="border-left-color: var(--blue); margin: 20px 0 0; max-width: 100%;">
        <div class="quote-badge" style="background: var(--blue-light); color: var(--blue);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <div class="quote-body">
          <span class="quote-kicker" style="color: var(--blue);">Clases en Video</span>
          <span class="quote-text" style="font-size: 0.92rem; font-weight: 500;">
            Cada clase abrirá el video correspondiente de YouTube en una pestaña nueva para que estudies a pantalla completa y sin interrupciones.
          </span>
        </div>
      </div>
    </section>

    <!-- LISTA DE CLASES EN GRID -->
    <section class="section" style="padding-top: 0;" id="course-content">
      <div class="lesson-grid" id="lesson-list">
        <!-- app.js inyecta aquí las clases -->
      </div>
    </section>

  </main>

  <!-- =====================================================
       NAVEGACIÓN MÓVIL INFERIOR (BOTTOM NAV)
  ===================================================== -->
  <!-- =====================================================
       BARRA DE NAVEGACIÓN INFERIOR (BOTTOM NAV MOBILE APP)
  ===================================================== -->
  <nav class="app-bottom-nav" aria-label="Navegación Móvil">
    <a href="index.html" class="app-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Inicio</span>
    </a>
    <a href="cursos.html" class="app-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span>Cursos</span>
    </a>
    <a href="biblioteca.html" class="app-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
        <path d="M2 17l10 5 10-5"></path>
        <path d="M2 12l10 5 10-5"></path>
      </svg>
      <span>Recursos</span>
      <span class="app-nav-badge">NUEVO</span>
    </a>
    <a href="simulador.html" class="app-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polygon points="10 8 16 12 10 16 10 8"></polygon>
      </svg>
      <span>Simulador</span>
    </a>
  </nav>

</body>
</html>
